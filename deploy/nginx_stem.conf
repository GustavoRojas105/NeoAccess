# NeoAccess - nginx del servidor stem.itsoeh.edu.mx (contenedor nginx:alpine en red host).
# Se instala en /opt/thingsboard-proxy/default.conf (el nombre de la carpeta viene del montaje anterior).
# El certificado lo emite y renueva certbot en el host (/etc/letsencrypt).

server {
    listen 80;
    server_name stem.itsoeh.edu.mx;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name stem.itsoeh.edu.mx;

    ssl_certificate /etc/letsencrypt/live/stem.itsoeh.edu.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stem.itsoeh.edu.mx/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Fotos del registro facial, Excel de horarios y zip de la Raspberry
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

# Cualquier otro nombre (o la IP directa) no recibe nada
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    ssl_certificate /etc/letsencrypt/live/stem.itsoeh.edu.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stem.itsoeh.edu.mx/privkey.pem;
    return 444;
}
